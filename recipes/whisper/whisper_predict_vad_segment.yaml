## Whisper inference with VAD segment decoding
## Requires: pip install eole[vad]
## Usage:
##   echo "/path/to/audio.wav" > ./audio_files.txt
##   eole predict -config recipes/whisper/whisper_predict_vad_segment.yaml

model_path: "$EOLE_MODEL_DIR/whisper-base-eole"
data_type: audio
src: ./audio_files.txt
output: ./transcription_vad_segment.txt
transforms: [silero_vad]
vad_mode: segment
timestamps: segment
beam_size: 5
length_penalty: none
max_length: 448
gpu_ranks: [0]
batch_type: sents
batch_size: 1
language: en
task: transcribe
condition_on_previous_text: true
seed: 0
verbose: true
