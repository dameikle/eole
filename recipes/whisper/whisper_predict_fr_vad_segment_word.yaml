## Whisper inference — French transcription with VAD segment decode + word timestamps
## Requires a multilingual Whisper model (e.g. openai/whisper-small)
## Requires: pip install -e .[vad]

model_path: "$EOLE_MODEL_DIR/whisper-small-eole"
data_type: audio
src: ./audio_files.txt
output: ./fr_words.json
transforms: [silero_vad]
vad_mode: segment
timestamps: word
word_timestamps_backend: wav2vec2
word_alignment_model: VOXPOPULI_ASR_BASE_10K_FR
beam_size: 5
length_penalty: none
max_length: 448
gpu_ranks: [0]
batch_type: sents
batch_size: 1
language: fr
task: transcribe
seed: 0
verbose: true
