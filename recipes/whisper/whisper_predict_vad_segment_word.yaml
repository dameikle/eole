## Whisper inference with VAD segment decoding + word timestamps
## Requires: pip install -e .[vad,align]

model_path: "$EOLE_MODEL_DIR/whisper-base-eole"
data_type: audio
src: ./audio_files.txt
output: ./transcription_vad_segment_word.txt
transforms: [silero_vad]
vad_mode: segment
timestamps: word
word_timestamps_backend: auto
word_alignment_min_duration: 0.02
word_alignment_max_duration: 1.5
word_alignment_cap_outliers: true
beam_size: 5
length_penalty: none
max_length: 448
gpu_ranks: [0]
batch_type: sents
batch_size: 1
language: en
task: transcribe
condition_on_previous_text: true
seed: 0
verbose: true
